name: CI

# The checks, run at the boundaries and nowhere else.
#
# There used to be three operating systems here, because there was a binary to build on
# each. There is no binary: the pack is plain JavaScript with zero npm dependencies and the
# the launchers are batch, PowerShell and POSIX sh over the pinned `dsh web`. A `node:24`
# container is the whole toolchain, so one job on one runner covers every platform this
# ships to - and the runtime the checks run on is the one `package.json` declares.
#
# A push to main starts NOTHING: CI runs at the boundaries - a pull request, a manual
# dispatch, and, through `workflow_call`, the gate a release passes before it publishes
# anything.
#
# NO THIRD-PARTY ACTIONS, and that is a constraint rather than a taste: this repository's
# Actions policy is `local_only`, so `actions/checkout` is refused at STARTUP (measured: a
# pull request produced a `startup_failure` in 0 s). Every step below is a shell command
# against a tool the image carries, and the checkout is `git` itself.
on:
  # NO `push` TRIGGER, on purpose: a release reaches this workflow through `workflow_call`
  # from release.yml, and a commit does not need a runner to be believed.
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'assets/**'
  workflow_dispatch:
  workflow_call:

# A superseded push has nothing to say. Cancel it and let the next one run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Node checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: node:24-bookworm
    steps:
      # The image is Node and nothing else. `git` is the one addition, for two reasons that
      # are not optional: the checkout below IS git, and check-no-secrets reads the set
      # `git add -A` would stage, which is a question only git can answer.
      - name: git
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends git ca-certificates >/dev/null
          git --version
          # The container runs as root over a workspace the runner owns, and git refuses a
          # repository it thinks belongs to somebody else. Naming the workspace is the fix,
          # and it is narrower than trusting every directory.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The checkout step, without an action. `pull_request` checks the merge commit GitHub
      # already built (refs/pull/N/merge); everything else checks the sha.
      - name: Checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ref="$GITHUB_SHA"
          if [ -n "$PR_NUMBER" ]; then ref="refs/pull/$PR_NUMBER/merge"; fi
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$ref"
          git checkout -q FETCH_HEAD

      # The floor is the pack's own `engines.node`. A check that only passes on another
      # runtime fails here by name instead of somewhere inside a script.
      - name: Node
        shell: bash
        run: |
          node --version
          node -e "const n = process.versions.node.split('.').map(Number); if (n[0] < 22) { console.error('Node ' + process.versions.node + ' is below the pack floor (22)'); process.exit(1) }"

      # The one check that is about the repository rather than a platform, and the one whose
      # failure can never be undone by a later commit.
      - name: No secrets
        run: node scripts/checks/check-no-secrets.mjs

      # The layout, the console contract, the portable-root rule and the two workflows.
      # It drives `setup/install.bat -Help` only on a Windows host and says so loudly
      # elsewhere, so this job proves the shape here and the launch is proved by hand.
      - name: Scripts and workflows
        run: node scripts/checks/check-scripts.mjs
