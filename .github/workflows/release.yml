name: Release

# A tag publishes a release, and the release is ONE file: a zip of the repository at that
# tag. There is no second artefact and no per-OS build, because there is nothing to build -
# the pack is plain JavaScript, the launchers are batch, PowerShell and POSIX sh, and the
# only thing a machine needs is Node.js >= 22.
#
# This is what "the distribution is this repository" means in practice: the zip carries the
# pack, the launchers, the checks and the docs, and nothing else is handed out.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package'
        required: true

permissions:
  contents: write

env:
  STEM: vncode
  GH_REPO: ${{ github.repository }}

jobs:
  # A tag is a promise that the commit it names passed the checks. The gate calls the same
  # workflow a pull request runs rather than a copy of it, so the two cannot drift: a red
  # check stops the release here, before a draft exists to be published.
  gate:
    name: Gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Create the release once, as a draft. It becomes visible only after the zip and
  # SHA256SUMS.txt are attached, so a half-finished release cannot be downloaded.
  prepare:
    name: Prepare release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the draft release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "${STEM} ${TAG}" --generate-notes

  package:
    name: Repository zip
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No third-party actions anywhere in this workflow: the repository's Actions policy
      # is `local_only`, so a marketplace action is refused at startup.
      - name: Checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.event.inputs.tag || github.ref }}
        run: |
          git init -q .
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --depth 1 origin "$REF"
          git checkout -q FETCH_HEAD

      # The launcher must answer its own -Help before it ships, and it must do so with no
      # interpreter of this job's own involved: this is the file a person double-clicks.
      - name: It runs
        shell: bash
        run: |
          sh scripts/run-web.sh -Help > /dev/null
          echo "run-web.sh -Help: ok"

      - name: Package
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          NAME="${STEM}-${VERSION}"
          # `git archive` IS the ship list: every tracked file, with its mode and its
          # `.gitattributes` line endings - so `run-web.sh` arrives executable and the batch
          # entry points keep the CRLF cmd.exe expects. Nothing untracked can ride along,
          # and there is no include list to fall out of step with the tree.
          git archive --format=zip --prefix="${NAME}/" -o "${NAME}.zip" HEAD
          echo "ASSET=${NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" "$ASSET" --clobber

  checksums:
    name: SHA256SUMS.txt
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A checksum file computed before the last upload is a lie, so this job waits for the
      # artefact and re-downloads what was actually published.
      - name: Collect and publish SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p assets
          gh release download "$TAG" --pattern '*' --dir assets
          rm -f assets/SHA256SUMS.txt
          (cd assets && sha256sum ./* > SHA256SUMS.txt)
          gh release upload "$TAG" assets/SHA256SUMS.txt --clobber

  publish:
    name: Publish
    needs: checksums
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release edit "$TAG" --draft=false
