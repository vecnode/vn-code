[package]
name = "vn-shell-egui"
description = "The vncode shell's control panel: the first page, the status, the location map and the log."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = []
# The pane: a child web view inside this window, via `vn-shell-pane`. OFF by default, so
# the default build compiles no engine, adds no dependency to the graph it links, and keeps
# the browser hand-off as its only surface.
#
# The pane crate's OWN feature is named as well, and that is not redundancy: enabling the
# dependency is not enabling its engine, so without `vn-shell-pane/pane` the engine and the
# page are `#[cfg]`-compiled out and every use of them fails as "found an item that was
# configured out".
pane = ["vn-shell-pane/pane"]

[dependencies]
vn-shell-core.workspace = true
vn-shell-runtime.workspace = true
vn-shell-paths.workspace = true
vn-shell-pane = { workspace = true, optional = true }
eframe.workspace = true
egui.workspace = true
