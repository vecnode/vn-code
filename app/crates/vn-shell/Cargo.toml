[package]
name = "vn-shell"
description = "The vncode shell binary: the control panel that starts, watches and stops the pinned harness."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
# The distribution ships `vncode.exe`, `scripts/run-desktop.bat` looks for
# `vncode.exe`, and the single-file build unpacks a folder whose START-HERE starts
# `vncode`. ONE name, and it is not the crate's.
[[bin]]
name = "vncode"
path = "src/main.rs"

[dependencies]
vn-shell-core.workspace = true
vn-shell-runtime.workspace = true
vn-shell-egui.workspace = true
vn-shell-paths.workspace = true
eframe.workspace = true
url.workspace = true

# There is deliberately NO `pane` feature here yet. The panel reaches a pane
# through `vn_shell_egui::Pane`, and no implementation of it exists - the
# child-window work it needs is M3 of docs/PLAN-egui-shell.md and has not been
# measured on a real desktop. A feature flag that switches on nothing would let
# `-Mode embed` promise an embedded window and show an empty rectangle, so this
# build says plainly that it has no pane and uses the browser instead. The day the
# pane crate lands, `has_pane` becomes `pane.is_some()` and nothing else moves.
