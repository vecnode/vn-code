[package]
name = "vn-shell"
description = "The vncode binary: the front door that installs the pack, takes the key and runs the web launcher."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
# The distribution ships `vncode`, and every launcher and doc looks for that name.
# ONE name, and it is not the crate's.
[[bin]]
name = "vncode"
path = "src/main.rs"

[features]
default = []

[dependencies]
vn-shell-core.workspace = true
vn-shell-runtime.workspace = true
rpassword.workspace = true
