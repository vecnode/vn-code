[workspace]
resolver = "2"
members = [
    "crates/vn-shell-core",
    "crates/vn-shell-runtime",
    "crates/vn-shell",
]

# One pin per dependency, so the shell cannot end up with two of anything. The
# binary is `vncode` because that is the name the distribution ships and the
# launcher looks for.
[workspace.package]
version = "0.1.1"
edition = "2021"
license = "AGPL-3.0-only"
publish = false
rust-version = "1.95"

[workspace.dependencies]
vn-shell-core = { path = "crates/vn-shell-core" }
vn-shell-runtime = { path = "crates/vn-shell-runtime" }

serde_json = "1"

# The ONE dependency this app has that is not `std` plus JSON, and it is about a secret:
# the DeepSeek key is typed at a terminal, so the terminal must not echo it. ~10 KB, three
# platforms, no transitive tree.
rpassword = "7"

# THERE IS NO WEB ENGINE IN THIS WORKSPACE, and no GUI toolkit either - as a rule rather
# than a default. `wry` (WebView2 / WKWebView / WebKitGTK), `egui`, `eframe` and `wgpu`
# left with the window they drew: they were 13 of this binary's 15 MB. The page is the
# harness's, it is served on loopback, and the browser that shows it is started by
# `scripts/run-web.*`.

[profile.release]
# What the shipped binary is built with - and the settings are a size decision, measured.
# `strip` removes what nothing reads; `lto = "thin"` pays for itself by removing duplicate
# generic instantiations across crates; `panic = "abort"` drops the unwinding tables a
# console app never uses. `codegen-units = 1` is what makes LTO able to see everything.
lto = "thin"
strip = "symbols"
panic = "abort"
codegen-units = 1
