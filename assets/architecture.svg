<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="520" viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">The pack on one page: npm, the web profile, the page</title>
      <desc id="architecture-desc">Three planes of one install target. npm ships the bundle and its pinned vendor trees. The web profile live-links that bundle and composes its rows at boot from the pinned line plus the pack's layers, with the host half mounting the services, tools and state behind the session cookie. The page loads the client bundle into the module table and reads bytes back over authenticated exact-path routes.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
        </pattern>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>
      <style>
        text { font-kerning: normal; }
        .node-name { font-family: 'Geist', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
        .sub { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 9px; fill: #4f5d75; }
        .zone-label { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 7px; letter-spacing: 0.14em; fill: #5a6580; }
        .chip { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 7px; letter-spacing: 0.08em; }
        .msg { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.08em; }
        .guard { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.04em; fill: #4f5d75; }
        .operator { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 8px; letter-spacing: 0.12em; fill: #4f5d75; }
        .actor-name { font-family: 'Geist', system-ui, sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
      </style>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

      <!-- Zones, then arrows, then nodes: z-order is bg -> zones -> arrows -> nodes. -->
      <rect x="40" y="88" width="272" height="160" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="56" y="92" width="100" height="12" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="106" y="101" text-anchor="middle">NPM · WHAT SHIPS</text>
      <rect x="364" y="88" width="272" height="392" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="380" y="92" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="460" y="101" text-anchor="middle">THE WEB PROFILE · WHAT BOOTS</text>
      <rect x="688" y="320" width="272" height="160" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="704" y="324" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text class="zone-label" x="772" y="333" text-anchor="middle">THE PAGE · WHAT RENDERS</text>

      <!-- Install: bundle -> profile, a straight horizontal run at the profile's own level. -->
      <line x1="296" y1="172" x2="380" y2="172" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <rect x="306" y="156" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text class="msg" x="338" y="166" text-anchor="middle" fill="#4f5d75">LIVE LINK</text>
      <!-- Boot: compose the rows, then mount them. -->
      <line x1="500" y1="216" x2="500" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text class="msg" x="512" y="236" fill="#4f5d75">compose the rows</text>
      <line x1="500" y1="332" x2="500" y2="360" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text class="msg" x="512" y="352" fill="#4f5d75">mount the services</text>
      <!-- The call the page makes, and the answer: an HTTP pair, left of the page node. -->
      <line x1="620" y1="404" x2="704" y2="404" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="632" y="388" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text class="msg" x="662" y="398" text-anchor="middle" fill="#2e5aa8">GET /API</text>
      <line x1="704" y1="428" x2="620" y2="428" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="646" y="412" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text class="msg" x="662" y="422" text-anchor="middle" fill="#4f5d75">200</text>

        <rect x="56" y="128" width="240" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="128" width="240" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="64" y="136" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text class="chip" x="78" y="145" text-anchor="middle" fill="#5a6580">PKG</text>
        <text class="node-name" x="176" y="166" text-anchor="middle">The bundle</text>
        <text class="sub" x="176" y="184" text-anchor="middle">npm package · dsh.bundle</text>
        <text class="sub" x="176" y="200" text-anchor="middle">lib/vendor pinned by sha256</text>
        <rect x="380" y="128" width="240" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="128" width="240" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="388" y="136" width="48" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text class="chip" x="412" y="145" text-anchor="middle" fill="#4f5d75">PROFILE</text>
        <text class="node-name" x="500" y="166" text-anchor="middle">The web profile</text>
        <text class="sub" x="500" y="184" text-anchor="middle">$DSH_HOME/profiles/web</text>
        <text class="sub" x="500" y="200" text-anchor="middle">live-linked, never copied</text>
        <rect x="380" y="244" width="240" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="244" width="240" height="88" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="388" y="252" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text class="chip" x="404" y="261" text-anchor="middle" fill="#bf4520">ROWS</text>
        <text class="node-name" x="500" y="282" text-anchor="middle">Rows, composed at boot</text>
        <text class="sub" x="500" y="300" text-anchor="middle">pinned line + pack layers</text>
        <text class="sub" x="500" y="316" text-anchor="middle">master last · a later layer wins</text>
        <rect x="380" y="360" width="240" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="360" width="240" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="388" y="368" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text class="chip" x="404" y="377" text-anchor="middle" fill="#2d3142">HOST</text>
        <text class="node-name" x="500" y="398" text-anchor="middle">The host half</text>
        <text class="sub" x="500" y="416" text-anchor="middle">lib/index.js · tools · state</text>
        <text class="sub" x="500" y="432" text-anchor="middle">routes behind the session cookie</text>
        <rect x="704" y="360" width="240" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="360" width="240" height="88" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="712" y="368" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text class="chip" x="734" y="377" text-anchor="middle" fill="#5a6580">MODULE</text>
        <text class="node-name" x="824" y="398" text-anchor="middle">The page</text>
        <text class="sub" x="824" y="416" text-anchor="middle">window.__ModuleLoader__.load</text>
        <text class="sub" x="824" y="432" text-anchor="middle">bundle edit → refresh (500 ms)</text>
    </svg>
