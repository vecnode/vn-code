<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="vncode">
  <!-- The app mark: a black circle, perfectly centred on (12,12), with a 1px
       transparent margin inside the 24px box. The margin is what keeps it from
       ever being shaved: the mark sits in boxes painted with `overflow:hidden`
       (the sidebar brand button is exactly 24px tall), where an edge-to-edge
       circle loses a fraction of a pixel on each side. -->
  <circle cx="12" cy="12" r="11" fill="#000000"/>
</svg>
