[mark]
name = "vn-code"
version = "1.0"
date = "2026-10-19"
grid = 24
stroke = 2.914
facets = 6
viewbox = "0 0 24 24"
geometry = "hexagon (12,2.8) (20.8,7.4) (20.8,16.6) (12,21.2) (3.2,16.6) (3.2,7.4); crown ridge (3.2,7.4)-(12,12)-(20.8,7.4); spine (12,2.8)-(12,21.2); girdle (12,15.4)-(3.2,16.6) and (12,15.4)-(20.8,16.6)"

[palette]
jade = "#1FA96B"
jade_highlight = "#74CAA3"
jade_deep = "#198856"
ink = "#0B0D10"
paper = "#FFFFFF"
muted = "#9AA1AC"

[contrast]
jade_on_ink = "6.44:1"
ink_on_jade = "6.44:1"
white_on_jade = "3.02:1 (large text and icons only)"
jade_on_paper = "3.02:1 (large text and icons only)"
highlight_on_ink = "9.93:1"
white_on_highlight = "1.96:1 (the application tile's ridges on the crown)"

[application_icon]
tile_px = 1024
tile_radius_px = 308
mark_scale = 22.73
mark_translate_px = 239.25
tile_fill = "#0B0D10"
ridge = "#FFFFFF"

[suite]
rule = "same crystal, one colour per application"
vn-launcher = "no inlay"
vn-ranger = "ember inlay"
vn-code = "jade inlay"

