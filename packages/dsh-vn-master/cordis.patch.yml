# dsh-vn-master bundle layer (alpha).
#
# The master is deliberately BLANK, and that is the whole design. This layer
# adds one no-op row and nothing else: no browser half (`dsh.client`), no client
# service, no `inject` edge, no node in the boot graph. The right bar keeps the
# `sidebarRightTabs` / `sidebarRight` services other tab types resolve - they
# live in the GENERATED fork dsh-rightbar/lib/client.js - so introducing the
# master cannot disturb the tab-type chain. The core-row disables also stay with
# the packages that replace those rows (dsh-rightbar disables ui-sidebar-right /
# ui-sidebar-files), so a partial `-Plugin` install still mounts one bar.
#
# What it is for:
#   - pack-wide patches (row restatements, extra disables, ordering) belong
#     here, so the right bar stops carrying responsibilities that are not the
#     bar's;
#   - it is installed LAST. `dsh-vn-master` sorts after every other package in
#     this repo, and `dsh plugin add` appends a new bundle, so this is the final
#     layer of the profile stack - and a later layer wins per row.
#
# The `master` row is a no-op on purpose: it marks the master as mounted and
# gives future work a row to restate instead of inventing a new one.
- insert:
    - id: master
      name: 'dsh-vn-master'

# ---------------------------------------------------------------------------
# The Browser tab, on the WEB profile (alpha.2 - the master's first row
# restatement, and the reason the master is no longer literally empty).
# ---------------------------------------------------------------------------
# 0.2 ships the right Sidebar's Browser tab DESKTOP-ONLY: `dsh-web-app`'s own
# layer declares it `disabled: !!js "ctx.get('profileContext')?.name !==
# 'desktop'"`, and the package's README documents the way in as a patch on the
# row. This pack targets the raw web profile, and a bundle layer may restate a
# shipped row, so the pack's FINAL layer performs that opt-in itself instead of
# asking every profile to carry a hand edit.
#
# Nothing else is needed for the tab to appear on the Start page, and nothing
# about the row is restated beyond its `disabled` flag - it keeps the `name` and
# the package the earlier layer declared it with.
#
# The browser package registers the tab TYPE and its own guide entry into the
# `sidebarRightTabs` registry - the same service dsh-rightbar's generated fork
# provides and dsh-editor / dsh-rightbar-files / dsh-gittree / dsh-pdf /
# dsh-diagrams register their own types into ("Browser" / "Browse web pages" in
# the shipped locales) - so the Start page lists it by itself. No pack code
# draws that entry, and no pack row is involved: only the shipped row is
# restated, which is exactly the work the master exists to do.
#
# `disabled: false` OVERRIDES the earlier layer's `!!js` expression, because a
# later layer wins per row. A desktop profile is not harmed: the expression it
# overrides already resolved to `false` there.
- id: ui-sidebar-browser
  disabled: false
