# dsh-diagrams bundle layer (alpha).
#
# One extra row ('diagrams') owns the whole plugin: its Node half registers the
# seven diagram tools (write/patch/read/verify/publish/delete, plus `diagram_kit`
# over the vendored Diagram Design kit), the three bundled skills, the
# per-conversation diagram store and the authenticated /api/dsh-diagrams/* routes
# (state, diagram read/write, the two sandboxed kit frames, content-addressed
# artifacts, export, the vendored Mermaid tree), and therefore ships its browser
# half (dsh.client) with the Loader entry.
#
# Nothing shipped is patched and no core row is disabled: this package adds
# surface - two tab types registered into the pack's own right bar (the
# `sidebarRightTabs` registry `dsh-rightbar` provides, one of which serves three
# address shapes so the kit needs no tab of its own) and one keyed
# `tool.call.toolview` entry per tool that renders a diagram inline in the
# conversation. There is therefore no `disabled: true` here and nothing for
# scripts/sync-vendored.ps1 to keep in sync: the vendored Mermaid engine is
# generated by packages/dsh-diagrams/vendor/build.mjs and the vendored Diagram
# Design kit by packages/dsh-diagrams/vendor/design/build.mjs, neither forked
# from core.
- insert:
    - id: diagrams
      name: 'dsh-diagrams'
