# dsh-cmdbar bundle layer (alpha).
#
# One extra row owns the command bar - the agent's own commands in a bottom dock.
# Its Node half registers ONE read-only route, /api/dsh-cmdbar/activity, which
# serves the tail of a conversation's command-relevant session events; its browser
# half contributes the header button that opens the bar and the view that folds
# those events.
#
# The package was `dsh-terminal` through alpha.13 and renamed at alpha.14: the old
# name described the EMULATOR it used to carry (deleted in alpha.12) and collided
# with the harness's own `@deepseek-ai/dsh-terminal` PTY seam, while what is left
# is the agent's commands, in a bar at the foot of the window.
#
# It USED to own a good deal more, and alpha.12 deleted it: a real PTY per dock
# slot, the authenticated WebSocket upgrade /api/dsh-terminal/pty that attached a
# browser xterm to it, the vendored xterm.js assets on two /vendor routes, and a
# /health probe. 0.2's right Sidebar ships terminal TABS of its own
# (@deepseek-ai/dsh-client-ui-sidebar-terminal), so the pack no longer spawns a
# shell at all - this row reads a log and nothing else, and `connection` is the
# only capability it injects.
#
# Nothing shipped is patched and no core row is disabled: this package adds
# surface, it replaces nothing, so there is no `disabled: true` here and nothing
# for scripts/sync-vendored.ps1 to keep in sync - like dsh-gittree, there is no
# fork of a core bundle. The panel is a root-scoped occupant of the layout's own
# `shell.overlay` LIST slot (the seat README documents), which is what puts it in
# the app's React tree while `position:fixed` keeps it clear of the frame's
# `overflow:hidden` - so it is a slot occupant, and no element is appended to
# document.body.
- insert:
    - id: cmdbar
      name: 'dsh-cmdbar'
